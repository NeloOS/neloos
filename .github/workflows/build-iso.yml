name: Build NeloOS ISO

# Run manually (Actions tab > Build NeloOS ISO > Run workflow),
# after the "Build NeloOS image" workflow has pushed the image to ghcr.io.
on:
  workflow_dispatch:

env:
  IMAGE_NAME: neloos
  BIB_IMAGE: quay.io/centos-bootc/bootc-image-builder:latest

jobs:
  iso:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Pull the NeloOS image
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE_REPO="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
          echo "IMAGE_REPO=${IMAGE_REPO}" >> "${GITHUB_ENV}"
          echo "${REGISTRY_PASSWORD}" | sudo podman login ghcr.io -u "${REGISTRY_USER}" --password-stdin
          sudo podman pull "${IMAGE_REPO}:latest"

      - name: Prepare installer config
        run: sed "s|ghcr.io/neloos/neloos|${IMAGE_REPO}|" disk_config/iso.toml > iso.toml

      - name: Build ISO
        run: |
          mkdir -p output
          sudo podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            -v ./iso.toml:/config.toml:ro \
            -v ./output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            "${BIB_IMAGE}" --type anaconda-iso --rootfs btrfs "${IMAGE_REPO}:latest"
          sudo mv output/bootiso/install.iso "output/neloos-$(date -u +%Y%m%d).iso"

      - name: Upload ISO as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: neloos-iso
          path: output/neloos-*.iso
          compression-level: 0
          retention-days: 7
