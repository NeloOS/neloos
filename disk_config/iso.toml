# bootc-image-builder config for the NeloOS installer ISO (Anaconda).
#
# After installation, %post points the machine at the image on the registry so it
# receives updates via `bootc upgrade`. CI replaces "ghcr.io/neloos/neloos" with the
# repository's actual registry path.

[customizations.installer.kickstart]
contents = """
%post
bootc switch --mutate-in-place --transport registry ghcr.io/neloos/neloos:latest
%end
"""

[customizations.installer.modules]
enable = [
  "org.fedoraproject.Anaconda.Modules.Localization",
  "org.fedoraproject.Anaconda.Modules.Network",
  "org.fedoraproject.Anaconda.Modules.Security",
  "org.fedoraproject.Anaconda.Modules.Storage",
  "org.fedoraproject.Anaconda.Modules.Timezone",
  "org.fedoraproject.Anaconda.Modules.Users",
]
